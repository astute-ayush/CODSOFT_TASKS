<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#1f2430;
    --text-muted:#6b7280;
    --border:#e2e5ea;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --done:#15803d;
    --done-bg:#eafaf0;
    --pending:#b45309;
    --pending-bg:#fef3e2;
    --danger:#b91c1c;
    --radius:8px;
  }
  [data-theme="dark"]{
    --bg:#15181f;
    --card:#1d2129;
    --text:#e7e9ee;
    --text-muted:#9aa0ac;
    --border:#2c313c;
    --primary:#3b82f6;
    --primary-dark:#2563eb;
    --done:#4ade80;
    --done-bg:#16311f;
    --pending:#fbbf24;
    --pending-bg:#3a2a0d;
    --danger:#f87171;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background .15s ease, color .15s ease;
  }
  a{color:inherit;}
  *:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}

  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:24px 0;
    margin-bottom:28px;
  }
  header .wrap{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  header h1{font-size:22px; margin:0; font-weight:700;}
  header p{margin:2px 0 0; color:var(--text-muted); font-size:13.5px;}
  .theme-btn{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .theme-btn:hover{border-color:var(--primary);}

  .summary{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .summary .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .summary .card h3{
    margin:0 0 6px;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--text-muted);
    font-weight:600;
  }
  .summary .card .value{font-size:24px; font-weight:700;}
  .summary .card.done .value{color:var(--done);}
  .summary .card.pending .value{color:var(--pending);}

  section{margin-bottom:28px;}
  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
  }
  .panel h2{margin:0 0 16px; font-size:16px; font-weight:700;}

  .grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:12px;
  }
  .grid .full{grid-column:1 / -1;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:13px; font-weight:600; color:var(--text-muted);}
  .field input, .field select{
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--card);
    color:var(--text);
    font-family:inherit;
  }
  .field input:focus, .field select:focus{border-color:var(--primary);}
  .field-error{font-size:12px; color:var(--danger); min-height:14px;}

  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:14px;}
  .btn{
    font-weight:600;
    font-size:14px;
    padding:9px 18px;
    border-radius:6px;
    cursor:pointer;
    border:1px solid var(--primary);
    background:var(--primary);
    color:#fff;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--card); color:var(--text); border-color:var(--border);}
  .btn.secondary:hover{border-color:var(--text-muted);}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .toolbar .search{flex:1; min-width:180px;}
  .toolbar input[type="search"]{
    width:100%;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--card);
    color:var(--text);
  }
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filters select{
    font-size:13px;
    padding:7px 9px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--card);
    color:var(--text);
  }

  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .list-head h2{margin:0; font-size:16px; font-weight:700;}
  .list-head .count{font-size:12.5px; color:var(--text-muted);}

  ul.task-list{list-style:none; margin:0; padding:0;}
  .task-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--border);
  }
  .task-item:last-child{border-bottom:none;}
  .task-item input[type="checkbox"]{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color:var(--primary);
    cursor:pointer;
    flex-shrink:0;
  }
  .task-body{flex:1; min-width:0;}
  .task-title{font-size:14.5px; font-weight:600; word-break:break-word;}
  .task-item.completed .task-title{text-decoration:line-through; color:var(--text-muted);}
  .task-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .badge{
    font-size:11.5px;
    padding:2px 9px;
    border-radius:20px;
    background:var(--bg);
    color:var(--text-muted);
    border:1px solid var(--border);
  }
  .badge.priority-high{color:var(--danger); border-color:var(--danger);}
  .badge.priority-medium{color:var(--pending); border-color:var(--pending);}
  .badge.priority-low{color:var(--done); border-color:var(--done);}
  .badge.overdue{color:var(--danger); border-color:var(--danger); font-weight:600;}

  .task-actions{display:flex; gap:8px; flex-shrink:0;}
  .link-btn{
    background:none; border:none; cursor:pointer;
    font-size:13px; color:var(--primary);
    padding:2px 4px;
  }
  .link-btn.danger{color:var(--danger);}
  .link-btn:hover{text-decoration:underline;}

  .empty-state{padding:36px 20px; text-align:center; color:var(--text-muted); font-size:14px;}

  footer{text-align:center; margin-top:40px; font-size:12.5px; color:var(--text-muted);}

  @media (max-width:640px){
    .summary{grid-template-columns:1fr;}
    .grid{grid-template-columns:1fr 1fr;}
    .grid .full{grid-column:1 / -1;}
    .toolbar{flex-direction:column; align-items:stretch;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>To-Do List</h1>
      <p>Organize your daily tasks</p>
    </div>
    <button class="theme-btn" id="theme-toggle">Dark mode</button>
  </div>
</header>

<div class="wrap">

  <div class="summary">
    <div class="card">
      <h3>Total Tasks</h3>
      <div class="value" id="sum-total">0</div>
    </div>
    <div class="card done">
      <h3>Completed</h3>
      <div class="value" id="sum-completed">0</div>
    </div>
    <div class="card pending">
      <h3>Pending</h3>
      <div class="value" id="sum-pending">0</div>
    </div>
  </div>

  <section>
    <div class="panel">
      <h2 id="form-title">Add Task</h2>
      <form id="entry-form" novalidate>
        <input type="hidden" id="edit-id" value="">
        <div class="grid">
          <div class="field full">
            <label for="title">Task</label>
            <input type="text" id="title" placeholder="e.g. Finish project report" maxlength="80">
            <span class="field-error" id="err-title"></span>
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option>Personal</option>
              <option>Work</option>
              <option>Study</option>
              <option>Errands</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="due">Due date</label>
            <input type="date" id="due">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn secondary" id="cancel-edit" style="display:none;">Cancel</button>
          <button type="submit" class="btn" id="submit-btn">Add Task</button>
        </div>
      </form>
    </div>
  </section>

  <section>
    <div class="list-head">
      <h2>Tasks</h2>
      <span class="count" id="task-count">0 tasks</span>
    </div>

    <div class="toolbar">
      <div class="search">
        <input type="search" id="search" placeholder="Search tasks...">
      </div>
      <div class="filters">
        <select id="filter-status" aria-label="Filter by status">
          <option value="all">All status</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
        <select id="filter-category" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
        <select id="filter-priority" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <div class="panel" style="padding:8px 16px;">
      <ul class="task-list" id="task-list"></ul>
    </div>
  </section>

</div>

<footer>Data is saved locally in your browser.</footer>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "todo-list.tasks.v1";
  const THEME_KEY = "todo-list.theme.v1";

  const els = {
    form: document.getElementById('entry-form'),
    title: document.getElementById('title'),
    category: document.getElementById('category'),
    priority: document.getElementById('priority'),
    due: document.getElementById('due'),
    submitBtn: document.getElementById('submit-btn'),
    cancelBtn: document.getElementById('cancel-edit'),
    editId: document.getElementById('edit-id'),
    formTitle: document.getElementById('form-title'),
    errTitle: document.getElementById('err-title'),
    taskList: document.getElementById('task-list'),
    sumTotal: document.getElementById('sum-total'),
    sumCompleted: document.getElementById('sum-completed'),
    sumPending: document.getElementById('sum-pending'),
    taskCount: document.getElementById('task-count'),
    search: document.getElementById('search'),
    filterStatus: document.getElementById('filter-status'),
    filterCategory: document.getElementById('filter-category'),
    filterPriority: document.getElementById('filter-priority'),
    themeToggle: document.getElementById('theme-toggle'),
  };

  let tasks = load();

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error('Could not read saved data', e);
      return [];
    }
  }
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }catch(e){
      console.error('Could not save data', e);
    }
  }

  function uid(){ return 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function formatDateLabel(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }
  function isOverdue(iso, completed){
    if(!iso || completed) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(iso + 'T00:00:00');
    return d < today;
  }

  // ---------- Theme ----------
  function applyTheme(theme){
    if(theme === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
      els.themeToggle.textContent = 'Light mode';
    } else {
      document.documentElement.removeAttribute('data-theme');
      els.themeToggle.textContent = 'Dark mode';
    }
  }
  els.themeToggle.addEventListener('click', ()=>{
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

  // ---------- Category filter population ----------
  function refreshCategoryFilterOptions(){
    const cats = Array.from(new Set(tasks.map(t=>t.category))).sort();
    const current = els.filterCategory.value;
    els.filterCategory.innerHTML = '<option value="all">All categories</option>' +
      cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if(cats.includes(current)) els.filterCategory.value = current;
  }

  // ---------- Validation ----------
  function validate(){
    els.errTitle.textContent = '';
    if(!els.title.value.trim()){
      els.errTitle.textContent = 'Enter a task description.';
      return false;
    }
    return true;
  }

  // ---------- Form submit ----------
  els.form.addEventListener('submit', e=>{
    e.preventDefault();
    if(!validate()) return;

    const payload = {
      title: els.title.value.trim(),
      category: els.category.value,
      priority: els.priority.value,
      due: els.due.value || null,
    };

    const editing = els.editId.value;
    if(editing){
      const idx = tasks.findIndex(t=>t.id === editing);
      if(idx > -1){
        tasks[idx] = { ...tasks[idx], ...payload };
      }
    } else {
      tasks.push({ id:uid(), completed:false, ...payload });
    }

    save();
    resetForm();
    refreshCategoryFilterOptions();
    render();
  });

  els.cancelBtn.addEventListener('click', resetForm);

  function resetForm(){
    els.form.reset();
    els.editId.value = '';
    els.priority.value = 'medium';
    els.formTitle.textContent = 'Add Task';
    els.submitBtn.textContent = 'Add Task';
    els.cancelBtn.style.display = 'none';
    els.errTitle.textContent = '';
  }

  function startEdit(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    els.editId.value = t.id;
    els.title.value = t.title;
    els.category.value = t.category;
    els.priority.value = t.priority;
    els.due.value = t.due || '';
    els.formTitle.textContent = 'Edit Task';
    els.submitBtn.textContent = 'Save Changes';
    els.cancelBtn.style.display = 'inline-block';
    els.form.scrollIntoView({ behavior:'smooth', block:'start' });
    els.title.focus();
  }

  function deleteTask(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    const ok = window.confirm(`Delete "${t.title}"? This can't be undone.`);
    if(!ok) return;
    tasks = tasks.filter(x=>x.id!==id);
    save();
    refreshCategoryFilterOptions();
    render();
  }

  function toggleComplete(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.completed = !t.completed;
    save();
    render();
  }

  // ---------- Filtering ----------
  function getFiltered(){
    const q = els.search.value.trim().toLowerCase();
    const status = els.filterStatus.value;
    const cat = els.filterCategory.value;
    const pri = els.filterPriority.value;

    return tasks
      .filter(t => !q || t.title.toLowerCase().includes(q))
      .filter(t => status==='all' || (status==='completed' ? t.completed : !t.completed))
      .filter(t => cat==='all' || t.category===cat)
      .filter(t => pri==='all' || t.priority===pri)
      .sort((a,b) => {
        if(a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.due || '9999').localeCompare(b.due || '9999');
      });
  }

  [els.search, els.filterStatus, els.filterCategory, els.filterPriority].forEach(el=>{
    el.addEventListener('input', ()=>render());
    el.addEventListener('change', ()=>render());
  });

  // ---------- Render ----------
  function render(){
    const list = getFiltered();

    if(list.length === 0){
      els.taskList.innerHTML = `<li class="empty-state">No tasks match. Add one above or adjust your filters.</li>`;
    } else {
      els.taskList.innerHTML = list.map(t=>{
        const overdue = isOverdue(t.due, t.completed);
        return `
          <li class="task-item ${t.completed ? 'completed' : ''}" data-id="${t.id}">
            <input type="checkbox" ${t.completed ? 'checked' : ''} data-action="toggle" data-id="${t.id}" aria-label="Mark task complete">
            <div class="task-body">
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                <span class="badge">${escapeHtml(t.category)}</span>
                <span class="badge priority-${t.priority}">${t.priority} priority</span>
                ${t.due ? `<span class="badge ${overdue ? 'overdue' : ''}">${overdue ? 'Overdue: ' : 'Due '}${formatDateLabel(t.due)}</span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="link-btn" data-action="edit" data-id="${t.id}">Edit</button>
              <button class="link-btn danger" data-action="delete" data-id="${t.id}">Delete</button>
            </div>
          </li>`;
      }).join('');
    }

    const total = tasks.length;
    const completed = tasks.filter(t=>t.completed).length;
    const pending = total - completed;

    els.sumTotal.textContent = total;
    els.sumCompleted.textContent = completed;
    els.sumPending.textContent = pending;
    els.taskCount.textContent = `${list.length} of ${total} shown`;
  }

  els.taskList.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.action === 'edit') startEdit(id);
    if(btn.dataset.action === 'delete') deleteTask(id);
  });
  els.taskList.addEventListener('change', e=>{
    const cb = e.target.closest('input[data-action="toggle"]');
    if(!cb) return;
    toggleComplete(cb.dataset.id);
  });

  // ---------- Init ----------
  refreshCategoryFilterOptions();
  render();

})();
</script>
</body>
</html>
